name: Notebook package validation
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      rerun_notebooks:
        description: Execute all 12 notebooks with real Jupyter kernels
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate_notebook_bundle.py
      - if: github.event_name == 'workflow_dispatch' && inputs.rerun_notebooks
        run: python -X utf8 scripts/check_jupyter.py --all
